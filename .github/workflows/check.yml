name: Check
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_call:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ github.token }}
          version: 2.5.2
          args: --config-path stylua.toml --check lib tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ github.token }}
      - uses: axiom-co/setup-pesde@b690699ace34169731b6b2a1c93b2008472038a7
      - run: pesde install
      - run: lute run tests
        env:
          FORCE_COLOR: "3"
