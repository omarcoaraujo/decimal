name = "omarcoaraujo/decimal"
version = "0.1.0"
description = "Exact money arithmetic in integer cents for Luau"
license = "MIT"
authors = ["omarcoaraujo <omarcoaraujo@outlook.com>"]
repository = "https://github.com/omarcoaraujo/decimal"
includes = ["pesde.toml", "README.md", "LICENSE", "lib/**/*"]

[target]
environment = "luau"
lib = "lib/init.luau"

[indices]
default = "https://github.com/pesde-pkg/index"

[dev_dependencies]
tint = { name = "omarcoaraujo/tint", version = "^0.2.1" }
